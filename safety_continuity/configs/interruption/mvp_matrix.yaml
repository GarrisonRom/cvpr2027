schema_version: 1
status: draft
contract_version: safety_continuity.v1
checkpoint_manifest_schema: checkpoint_manifest.v1
parent_training_config: safety_continuity/configs/training/pi05_lora_mvp.yaml
experiment:
  total_optimizer_steps: 2000
  positions: [500, 1000, 1500]
  primary_conditions: [A1, A2]
conditions:
  - id: A0
    type: continuous
    checkpoint_at_interruption: true
    terminate_process: false
  - id: A1
    type: full_state_resume
    terminate_process: true
    restore_plan:
      preserve: [model, optimizer, optimizer_moments, optimizer_step, scheduler_and_global_step, rng, batch_cursor, normalization, gradient_accumulation, amp_scaler, ema, distributed_layout]
      reset: []
      required: [model, optimizer, optimizer_moments, optimizer_step, scheduler_and_global_step, rng, batch_cursor, normalization]
  - id: A2
    type: optimizer_moments_reset
    terminate_process: true
    restore_plan:
      preserve: [model, optimizer, optimizer_step, scheduler_and_global_step, rng, batch_cursor, normalization, gradient_accumulation, amp_scaler, ema, distributed_layout]
      reset: [optimizer_moments]
      required: [model, optimizer, optimizer_moments, optimizer_step, scheduler_and_global_step, rng, batch_cursor, normalization]
  - id: A3
    type: weights_only_state_reset
    terminate_process: true
    restore_plan:
      preserve: [model, normalization]
      reset: [optimizer, optimizer_moments, optimizer_step, scheduler_and_global_step, rng, batch_cursor, gradient_accumulation, amp_scaler, ema, distributed_layout]
      required: [model]
    external_batch_manifest_still_fixed: true
inference:
  primary_comparison: A2_vs_A1
  resume_validity_control: A1_vs_A0
  composite_realistic_condition: A3
